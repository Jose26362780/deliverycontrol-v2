# Netlify — frontend estático (o backend roda no Render).
# O backend (dist/server.cjs) NÃO é usado aqui, então o build do Netlify
# compila só o frontend e nem precisa do Prisma/DATABASE_URL.
[build]
  command = "npm run build:frontend"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: o app navega por pushState (/dashboard, /entregas, ...).
# Sem isso, um reload ou redirect externo (ex: callback do Google para
# /dashboard) cai no "Page not found" do Netlify em vez de carregar o app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
